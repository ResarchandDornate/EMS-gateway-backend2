name: tests

# Phase 0 CI gate. The `fast` job needs no infrastructure and runs the unit +
# characterization suites (including the ORM metadata snapshot, Alembic chain integrity,
# and ingest contract locks). It is the gate that must stay green through the refactor.
# The `integration` job brings up Postgres/Redis/InfluxDB and runs the DB-backed suite.

on:
  pull_request:
  push:
    branches: [main, tarun-DB]

jobs:
  fast:
    name: unit + characterization (no infra)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://u:p@localhost/db
      REDIS_URL: redis://localhost:6379/0
      INFLUX_URL: http://localhost:8086
      INFLUX_TOKEN: ci-token
      INFLUX_ORG: ci-org
      INFLUX_BUCKET_RAW: telemetry_raw_90d
      INFLUX_BUCKET_LONG: telemetry_1y
      JWT_SECRET: ci-secret-not-used-for-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt || pip install -e .
          pip install pytest pytest-asyncio httpx
      - name: Run unit + characterization suites
        run: python -m pytest tests/unit tests/characterization -q

  integration:
    name: integration (Postgres + Redis + InfluxDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the full suite via docker compose
        # Mirrors the documented local command:
        #   docker compose run --rm --no-deps -v "$PWD":/work -w /work api python -m pytest
        run: |
          docker compose up -d postgres redis influxdb
          docker compose run --rm api python -m pytest tests/integration -q
      - name: Tear down
        if: always()
        run: docker compose down -v
